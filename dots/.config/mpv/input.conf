# ==================================
# RESIZE VIDEO CONTENT
# ==================================

# Change video width
Shift+LEFT  osd-msg add video-scale-x -0.05
Shift+RIGHT osd-msg add video-scale-x  0.05

# Change video height
Shift+DOWN  osd-msg add video-scale-y -0.05
Shift+UP    osd-msg add video-scale-y  0.05

# Reset video size, zoom and pan
Alt+BS set video-scale-x 1; set video-scale-y 1; set video-zoom 0; set video-pan-x 0; set video-pan-y 0


# ==================================
# SUBTITLE COLOR
# ==================================

# Cycle subtitle text color: white -> yellow -> cyan -> green -> pink
/ cycle-values sub-color "#FFFFFF" "#FFFF00" "#00FFFF" "#80FF80" "#FF80C0"


# ==================================
# SUBTITLE CONTROLS - ARROW KEYS
# ==================================

# Jump video to previous/next subtitle
Ctrl+LEFT  sub-seek -1
Ctrl+RIGHT sub-seek  1

# Move subtitles up/down
Ctrl+UP    add sub-pos -1
Ctrl+DOWN  add sub-pos  1

# Adjust subtitle synchronization to the previous/next subtitle
Ctrl+Shift+LEFT  sub-step -1
Ctrl+Shift+RIGHT sub-step  1


# ==================================
# SUBTITLE CONTROLS - HJKL EQUIVALENTS
# ==================================

# h/l = previous/next subtitle (same as Ctrl+LEFT/RIGHT)
Ctrl+h sub-seek -1
Ctrl+l sub-seek  1

# k/j = move subtitles up/down (same as Ctrl+UP/DOWN)
Ctrl+k add sub-pos -1
Ctrl+j add sub-pos  1

# Shift+h/l = adjust subtitle synchronization (same as Ctrl+Shift+LEFT/RIGHT)
Ctrl+H sub-step -1
Ctrl+L sub-step  1
